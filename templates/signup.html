{% extends "base.html" %}

{% block title %}Sign Up - EduLearn Hub{% endblock %}

{% block content %}
<section class="fade-in-el" style="padding: 60px 20px; display: flex; align-items: center; justify-content: center; flex-grow: 1;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EL" style="height: 60px; width: 60px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow-premium);">
            <h2 style="font-size: 1.75rem;">Create Student Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Join thousands of students preparing online</p>
        </div>

        <form id="signup-form">
            <!-- Name -->
            <div class="form-group">
                <label class="form-label" for="signup-name">Full Name</label>
                <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-control" placeholder="john@example.com" required>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label class="form-label" for="signup-mobile">Mobile Number</label>
                <input type="tel" id="signup-mobile" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" title="Ten digit mobile number" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <input type="password" id="signup-password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label" for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 15px;">Register Now</button>
        </form>

        <div style="margin-top: 25px; text-align: center; font-size: 0.9rem;">
            <p style="color: var(--text-secondary);">
                Already have an account? <a href="/login" style="color: var(--primary); font-weight: 500;">Log in here</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
